# Enhanced Pattern Definitions for v3-alpha
# Complete pattern library with NodeStateChange, ClusterView, and QuorumEvent
# Compatible with graf frame-based state machine

version: "3.0.0-alpha"
description: "Complete pattern library for v3-alpha with all missing entity types"

# ==============================================================================
# TEMPORAL ENTITY PATTERNS - Node State Changes
# ==============================================================================

node_state_patterns:

  - pattern_id: "node_state_shifting"
    entity_target: "NodeStateChange"
    description: "Captures local node state transitions (Shifting X -> Y)"
    priority: 100
    
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[Note\]\s+WSREP:\s+Shifting\s+(?P<from_state>CLOSED|OPEN|PRIMARY|JOINER|JOINED|SYNCED|DONOR/DESYNCED|DONOR|DESYNCED)\s+->\s+(?P<to_state>CLOSED|OPEN|PRIMARY|JOINER|JOINED|SYNCED|DONOR/DESYNCED|DONOR|DESYNCED)'
    
    context: LOCAL
    confidence: 0.98
    
    extraction_mapping:
      timestamp: "timestamp"
      from_state: "from_state"
      to_state: "to_state"
    
    transforms:
      timestamp: "parse_datetime"
      from_state: "normalize_state"
      to_state: "normalize_state"
    
    computed_fields:
      node_name: "local_node_name"
      node_uuid: "local_node_uuid"
      transition_type: "LOCAL_STATE_CHANGE"
      log_line: "current_line"
      line_number: "line_number"
    
    entity_type: "NodeStateChange"
    unique_by: ["timestamp", "node_name", "to_state", "line_number"]

  - pattern_id: "node_state_restored"
    entity_target: "NodeStateChange"
    description: "Captures restored state transitions"
    priority: 95
    
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[Note\]\s+WSREP:\s+Restored\s+state\s+(?P<from_state>CLOSED|OPEN|PRIMARY|JOINER|JOINED|SYNCED|DONOR/DESYNCED|DONOR|DESYNCED)\s+->\s+(?P<to_state>CLOSED|OPEN|PRIMARY|JOINER|JOINED|SYNCED|DONOR/DESYNCED|DONOR|DESYNCED)'
    
    context: LOCAL
    confidence: 0.96
    
    extraction_mapping:
      timestamp: "timestamp"
      from_state: "from_state"
      to_state: "to_state"
    
    transforms:
      timestamp: "parse_datetime"
      from_state: "normalize_state"
      to_state: "normalize_state"
    
    computed_fields:
      node_name: "local_node_name"
      node_uuid: "local_node_uuid"
      transition_type: "RESTORED_STATE"
      log_line: "current_line"
      line_number: "line_number"
    
    entity_type: "NodeStateChange"
    unique_by: ["timestamp", "node_name", "to_state", "line_number"]

  - pattern_id: "member_state_in_view"
    entity_target: "NodeStateChange"
    description: "Captures member states reported in view changes"
    priority: 85
    
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*Member\s+\d+\.\d+\s+\((?P<node_name>[A-Za-z0-9_.-]+)\)\((?P<node_state>SYNCED|JOINER|JOINED|DONOR)\)'
    
    context: PEER
    confidence: 0.85
    
    extraction_mapping:
      timestamp: "timestamp"
      node_name: "node_name"
      node_state: "node_state"
    
    transforms:
      timestamp: "parse_datetime"
      node_state: "normalize_state"
    
    computed_fields:
      from_state: null
      to_state: "node_state"
      transition_type: "PEER_STATE_OBSERVED"
      log_line: "current_line"
      line_number: "line_number"
    
    entity_type: "NodeStateChange"
    unique_by: ["timestamp", "node_name", "to_state"]

# ==============================================================================
# TEMPORAL ENTITY PATTERNS - Cluster Views
# ==============================================================================

cluster_view_patterns:

  - pattern_id: "view_change_primary"
    entity_target: "ClusterView"
    description: "Captures primary view changes with member info"
    priority: 100
    
    # Matches: "New cluster view: global state: uuid:seqno, view# M: primary"
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[Note\]\s+WSREP:\s+New\s+cluster\s+view:\s+global\s+state:\s+(?P<state_uuid>[a-f0-9-]+):(?P<state_seqno>\d+),\s+view#\s*(?P<view_seq>\d+):\s*(?P<view_status>primary|non-primary)'
    
    context: GLOBAL
    confidence: 0.95
    
    extraction_mapping:
      timestamp: "timestamp"
      state_uuid: "state_uuid"
      state_seqno: "state_seqno"
      view_seq: "view_seq"
      view_status: "view_status"
    
    transforms:
      timestamp: "parse_datetime"
      view_seq: "parse_int"
      state_seqno: "parse_int"
    
    computed_fields:
      view_id: "construct_view_id"  # state_uuid:view_seq
      is_primary: "check_primary_status"  # True if view_status == 'primary'
      log_line: "current_line"
      line_number: "line_number"
    
    entity_type: "ClusterView"
    unique_by: ["view_id", "timestamp"]

  - pattern_id: "view_members_summary"
    entity_target: "ClusterView"
    description: "Captures view member count details"
    priority: 90
    
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*Members:\s*(?P<member_count>\d+)\s*\(\s*joined:\s*(?P<joined>\d+),\s*left:\s*(?P<left>\d+),\s*partitioned:\s*(?P<partitioned>\d+)\s*\)'
    
    context: GLOBAL
    confidence: 0.85
    
    extraction_mapping:
      timestamp: "timestamp"
      member_count: "member_count"
      joined: "members_joined"
      left: "members_left"
      partitioned: "members_partitioned"
    
    transforms:
      timestamp: "parse_datetime"
      member_count: "parse_int"
      joined: "parse_int"
      left: "parse_int"
      partitioned: "parse_int"
    
    computed_fields:
      log_line: "current_line"
      line_number: "line_number"
    
    entity_type: "ClusterView"
    update_existing: true
    match_by: ["timestamp"]

  - pattern_id: "current_view_members"
    entity_target: "ClusterView"
    description: "Captures member list from view"
    priority: 80
    multiline: true
    
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*current_view:.*members\s*\('
    
    context: GLOBAL
    confidence: 0.80
    
    # This pattern needs multi-line parsing
    # Following lines contain member info
    
    entity_type: "ClusterView"
    multiline_parser: "extract_view_members"

# ==============================================================================
# TEMPORAL ENTITY PATTERNS - Quorum Events
# ==============================================================================

quorum_patterns:

  - pattern_id: "quorum_lost"
    entity_target: "QuorumEvent"
    description: "Detects quorum loss events"
    priority: 100
    
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*WSREP:.*(?:quorum lost|non-primary\s+view)'
    
    context: GLOBAL
    confidence: 0.98
    
    extraction_mapping:
      timestamp: "timestamp"
    
    transforms:
      timestamp: "parse_datetime"
    
    computed_fields:
      event_type: "'QUORUM_LOST'"
      quorum_status: "False"
      severity: "'CRITICAL'"
      log_line: "current_line"
      line_number: "line_number"
    
    entity_type: "QuorumEvent"
    unique_by: ["timestamp", "event_type"]

  - pattern_id: "quorum_regained"
    entity_target: "QuorumEvent"
    description: "Detects quorum regained / primary view restored"
    priority: 100
    
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*WSREP:.*(?:primary\s+view|quorum.*(?:restored|regained))'
    
    context: GLOBAL
    confidence: 0.95
    
    extraction_mapping:
      timestamp: "timestamp"
    
    transforms:
      timestamp: "parse_datetime"
    
    computed_fields:
      event_type: "'QUORUM_REGAINED'"
      quorum_status: "True"
      severity: "'INFO'"
      log_line: "current_line"
      line_number: "line_number"
    
    entity_type: "QuorumEvent"
    unique_by: ["timestamp", "event_type"]

  - pattern_id: "quorum_block"
    entity_target: "QuorumEvent"
    description: "Captures detailed quorum block information"
    priority: 90
    multiline: true
    
    # Start pattern for quorum block
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*WSREP:.*\[quorum\]'
    
    context: GLOBAL
    confidence: 0.85
    
    # Multi-line block that ends when next log line starts
    multiline_parser: "extract_quorum_details"
    
    entity_type: "QuorumEvent"
    unique_by: ["timestamp", "line_number"]

# ==============================================================================
# TEMPORAL ENTITY PATTERNS - State Transfer Enhanced
# ==============================================================================

state_transfer_patterns:

  - pattern_id: "sst_started"
    entity_target: "StateTransfer"
    description: "SST started - requesting state transfer"
    priority: 100
    
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*WSREP:.*Requesting\s+(?:state transfer|SST)(?::\s*(?P<method>\w+))?'
    
    context: LOCAL
    confidence: 0.95
    
    extraction_mapping:
      timestamp: "timestamp"
      method: "method"
    
    transforms:
      timestamp: "parse_datetime"
    
    computed_fields:
      transfer_type: "'SST'"
      status: "'STARTED'"
      joiner_node: "local_node_name"
      joiner_uuid: "local_node_uuid"
      log_line: "current_line"
      line_number: "line_number"
    
    entity_type: "StateTransfer"
    unique_by: ["timestamp", "joiner_node"]

  - pattern_id: "sst_donor_selected"
    entity_target: "StateTransfer"
    description: "SST donor selected for joiner"
    priority: 95
    
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*Member\s+\d+\.\d+\s+\((?P<joiner_name>[A-Za-z0-9_.-]+)\)\s+requested\s+state\s+transfer.*Selected\s+\d+\.\d+\s+\((?P<donor_name>[A-Za-z0-9_.-]+)\)\((?P<donor_state>SYNCED|DONOR)\)'
    
    context: GLOBAL
    confidence: 0.90
    
    extraction_mapping:
      timestamp: "timestamp"
      joiner_name: "joiner_name"
      donor_name: "donor_name"
      donor_state: "donor_state"
    
    transforms:
      timestamp: "parse_datetime"
    
    computed_fields:
      transfer_type: "'SST'"
      status: "'DONOR_SELECTED'"
      log_line: "current_line"
      line_number: "line_number"
    
    entity_type: "StateTransfer"
    unique_by: ["timestamp", "joiner_name", "donor_name"]

  - pattern_id: "sst_completed"
    entity_target: "StateTransfer"
    description: "SST completed successfully"
    priority: 100
    
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*WSREP:.*SST\s+complete,\s+seqno:\s*(?P<end_seqno>\d+)'
    
    context: LOCAL
    confidence: 0.98
    
    extraction_mapping:
      timestamp: "timestamp"
      end_seqno: "end_seqno"
    
    transforms:
      timestamp: "parse_datetime"
      end_seqno: "parse_int"
    
    computed_fields:
      transfer_type: "'SST'"
      status: "'COMPLETED'"
      joiner_node: "local_node_name"
      log_line: "current_line"
      line_number: "line_number"
    
    entity_type: "StateTransfer"
    unique_by: ["timestamp", "joiner_node", "status"]

  - pattern_id: "ist_started"
    entity_target: "StateTransfer"
    description: "IST started - incremental state transfer"
    priority: 100
    
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*WSREP:.*IST.*(?:first:|starting).*seqno\s+(?P<first_seqno>\d+)'
    
    context: LOCAL
    confidence: 0.90
    
    extraction_mapping:
      timestamp: "timestamp"
      first_seqno: "first_seqno"
    
    transforms:
      timestamp: "parse_datetime"
      first_seqno: "parse_int"
    
    computed_fields:
      transfer_type: "'IST'"
      status: "'STARTED'"
      joiner_node: "local_node_name"
      log_line: "current_line"
      line_number: "line_number"
    
    entity_type: "StateTransfer"
    unique_by: ["timestamp", "joiner_node", "first_seqno"]

  - pattern_id: "ist_completed"
    entity_target: "StateTransfer"
    description: "IST completed successfully"
    priority: 100
    
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*WSREP:.*IST.*(?:complete|received).*(?:last|seqno):\s*(?P<last_seqno>\d+)'
    
    context: LOCAL
    confidence: 0.95
    
    extraction_mapping:
      timestamp: "timestamp"
      last_seqno: "last_seqno"
    
    transforms:
      timestamp: "parse_datetime"
      last_seqno: "parse_int"
    
    computed_fields:
      transfer_type: "'IST'"
      status: "'COMPLETED'"
      joiner_node: "local_node_name"
      log_line: "current_line"
      line_number: "line_number"
    
    entity_type: "StateTransfer"
    unique_by: ["timestamp", "joiner_node", "status"]

# ==============================================================================
# TEMPORAL ENTITY PATTERNS - Error Events Enhanced
# ==============================================================================

error_patterns:

  - pattern_id: "error_generic"
    entity_target: "ErrorEvent"
    description: "Generic ERROR level messages"
    priority: 70
    
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*\[ERROR\]\s+WSREP:\s+(?P<message>.*)'
    
    context: LOCAL
    confidence: 0.75
    
    extraction_mapping:
      timestamp: "timestamp"
      message: "message"
    
    transforms:
      timestamp: "parse_datetime"
    
    computed_fields:
      severity: "'ERROR'"
      error_type: "classify_error"
      node_name: "local_node_name"
      log_line: "current_line"
      line_number: "line_number"
    
    entity_type: "ErrorEvent"
    unique_by: ["timestamp", "message", "line_number"]

  - pattern_id: "warning_generic"
    entity_target: "ErrorEvent"
    description: "Generic Warning level messages"
    priority: 65
    
    regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*\[Warning\]\s+WSREP:\s+(?P<message>.*)'
    
    context: LOCAL
    confidence: 0.70
    
    extraction_mapping:
      timestamp: "timestamp"
      message: "message"
    
    transforms:
      timestamp: "parse_datetime"
    
    computed_fields:
      severity: "'WARNING'"
      error_type: "classify_error"
      node_name: "local_node_name"
      log_line: "current_line"
      line_number: "line_number"
    
    entity_type: "ErrorEvent"
    unique_by: ["timestamp", "message", "line_number"]

# ==============================================================================
# METADATA
# ==============================================================================

metadata:
  version: "3.0.0-alpha"
  total_patterns: 21
  pattern_categories:
    node_state_patterns: 3
    cluster_view_patterns: 3
    quorum_patterns: 3
    state_transfer_patterns: 6
    error_patterns: 2
  features:
    - Complete NodeStateChange tracking (local and peer states)
    - Full ClusterView extraction with member details
    - Comprehensive QuorumEvent detection (lost/regained)
    - Enhanced StateTransfer patterns (SST and IST)
    - Improved ErrorEvent classification
  compatibility:
    - graf frame-based state machine
    - Chronological ordering with timestamp indices
    - Multiple entities per timestamp supported
  frame_generation:
    - Each entity generates a frame
    - timestamp + timestamp_index for ordering
    - Maintains sequence for same-timestamp events
