# MariaDB 10.6 Specific Cluster View Patterns
# Patterns for the actual log format used by MariaDB 10.6

version: "10.6"
description: "Cluster view patterns for actual MariaDB 10.6 Galera cluster log format"
mariadb_versions: ["10.6", "10.7", "10.8", "10.9", "10.10", "10.11"]

patterns:
  VIEW:
    - name: "mariadb_10_6_view_formation"
      description: "MariaDB 10.6 view formation with detailed membership"
      confidence: 0.95
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+view\(view_id\((?P<state>PRIM|NON_PRIM),(?P<view_id>[a-f0-9-]+),(?P<view_seq>\d+)\)\s+memb\s+\{'
      required_fields: ["state", "view_id", "view_seq"]
      examples:
        - "2025-09-15 13:45:55 0 [Note] WSREP: view(view_id(PRIM,378c0ec7-a3db,16) memb {"
        - "2025-09-15 13:48:12 0 [Note] WSREP: view(view_id(PRIM,378c0ec7-a3db,17) memb {"
      test_cases:
        - input: "2025-09-15 13:45:55 0 [Note] WSREP: view(view_id(PRIM,378c0ec7-a3db,16) memb {"
          expected:
            timestamp: "2025-09-15 13:45:55"
            level: "Note"
            state: "PRIM"
            view_id: "378c0ec7-a3db"
            view_seq: "16"

    - name: "node_state_prim"
      description: "Node state in primary partition"
      confidence: 0.9
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+Node\s+(?P<node_id>[a-f0-9-]+)\s+state\s+(?P<state>prim|non-prim)'
      required_fields: ["node_id", "state"]
      examples:
        - "2025-09-15 13:45:55 0 [Note] WSREP: Node 378c0ec7-a3db state prim"
        - "2025-09-15 13:48:12 0 [Note] WSREP: Node 378c0ec7-a3db state prim"
      test_cases:
        - input: "2025-09-15 13:45:55 0 [Note] WSREP: Node 378c0ec7-a3db state prim"
          expected:
            timestamp: "2025-09-15 13:45:55"
            level: "Note"
            node_id: "378c0ec7-a3db"
            state: "prim"

    - name: "connection_established"
      description: "Connection established between nodes"
      confidence: 0.8
      regex: >-
        (?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+
        \((?P<local_node>[a-f0-9-]+),\s+\'tcp://(?P<local_addr>[^\']+)\'\)\s+connection\s+established\s+to\s+
        (?P<remote_node>[a-f0-9-]+)\s+tcp://(?P<remote_addr>[\d\.]+:\d+)
      required_fields: ["local_node", "remote_node"]
      examples:
        - "2025-09-15 13:45:54 0 [Note] WSREP: (378c0ec7-a3db, 'tcp://0.0.0.0:4567') connection established to 4d1157d4-8693 tcp://10.0.1.192:4567"
      test_cases:
        - input: "2025-09-15 13:45:54 0 [Note] WSREP: (378c0ec7-a3db, 'tcp://0.0.0.0:4567') connection established to 4d1157d4-8693 tcp://10.0.1.192:4567"
          expected:
            timestamp: "2025-09-15 13:45:54"
            level: "Note"
            local_node: "378c0ec7-a3db"
            local_addr: "0.0.0.0:4567"
            remote_node: "4d1157d4-8693"
            remote_addr: "10.0.1.192:4567"

    - name: "node_declaring_stable"
      description: "Node declaring another node as stable"
      confidence: 0.85
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+declaring\s+(?P<node_id>[a-f0-9-]+)\s+at\s+tcp://(?P<node_addr>[\d\.]+:\d+)\s+stable'
      required_fields: ["node_id", "node_addr"]
      examples:
        - "2025-09-15 13:45:55 0 [Note] WSREP: declaring 4d1157d4-8693 at tcp://10.0.1.192:4567 stable"
      test_cases:
        - input: "2025-09-15 13:45:55 0 [Note] WSREP: declaring 4d1157d4-8693 at tcp://10.0.1.192:4567 stable"
          expected:
            timestamp: "2025-09-15 13:45:55"
            level: "Note"
            node_id: "4d1157d4-8693"
            node_addr: "10.0.1.192:4567"

    - name: "node_forgetting"
      description: "Node forgetting disconnected member"
      confidence: 0.8
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+forgetting\s+(?P<node_id>[a-f0-9-]+)\s+\(tcp://(?P<node_addr>[\d\.]+:\d+)\)'
      required_fields: ["node_id", "node_addr"]
      examples:
        - "2025-09-15 13:48:12 0 [Note] WSREP: forgetting 4d1157d4-8693 (tcp://10.0.1.192:4567)"
      test_cases:
        - input: "2025-09-15 13:48:12 0 [Note] WSREP: forgetting 4d1157d4-8693 (tcp://10.0.1.192:4567)"
          expected:
            timestamp: "2025-09-15 13:48:12"
            level: "Note"
            node_id: "4d1157d4-8693"
            node_addr: "10.0.1.192:4567"

    - name: "cleaning_up_node"
      description: "Cleaning up disconnected node"
      confidence: 0.75
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+cleaning\s+up\s+(?P<node_id>[a-f0-9-]+)\s+\(tcp://(?P<node_addr>[\d\.]+:\d+)\)'
      required_fields: ["node_id", "node_addr"]
      examples:
        - "2025-09-15 13:45:54 0 [Note] WSREP:  cleaning up f85a74b7-87a9 (tcp://10.0.1.192:4567)"
      test_cases:
        - input: "2025-09-15 13:45:54 0 [Note] WSREP:  cleaning up f85a74b7-87a9 (tcp://10.0.1.192:4567)"
          expected:
            timestamp: "2025-09-15 13:45:54"
            level: "Note"
            node_id: "f85a74b7-87a9"
            node_addr: "10.0.1.192:4567"

    - name: "member_synced_with_group"
      description: "Member synchronized with group"
      confidence: 0.9
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+Member\s+(?P<member_id>[\d\.]+)\s+\((?P<member_name>[^)]+)\)\s+synced\s+with\s+group'
      required_fields: ["member_id", "member_name"]
      examples:
        - "2025-09-15 13:50:35 0 [Note] WSREP: Member 0.1 (UAT-DB-03) synced with group."
      test_cases:
        - input: "2025-09-15 13:50:35 0 [Note] WSREP: Member 0.1 (UAT-DB-03) synced with group."
          expected:
            timestamp: "2025-09-15 13:50:35"
            level: "Note"
            member_id: "0.1"
            member_name: "UAT-DB-03"

    - name: "server_status_change"
      description: "Server status transition between states"
      confidence: 0.95
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+Server\s+status\s+change\s+(?P<from_state>\w+)\s+->\s+(?P<to_state>\w+)'
      required_fields: ["from_state", "to_state"]
      examples:
        - "2025-09-15 13:52:58 2 [Note] WSREP: Server status change joined -> synced"
      test_cases:
        - input: "2025-09-15 13:52:58 2 [Note] WSREP: Server status change joined -> synced"
          expected:
            timestamp: "2025-09-15 13:52:58"
            level: "Note"
            from_state: "joined"
            to_state: "synced"

    - name: "state_shift"
      description: "Node state shift transitions"
      confidence: 0.9
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+Shifting\s+(?P<from_state>[\w/]+)\s+->\s+(?P<to_state>\w+)(?:\s+\(TO:\s+(?P<transaction_order>\d+)\))?'
      required_fields: ["from_state", "to_state"]
      examples:
        - "2025-09-15 13:48:11 0 [Note] WSREP: Shifting DONOR/DESYNCED -> JOINED (TO: 1645)"
        - "2025-09-15 13:50:35 0 [Note] WSREP: Shifting JOINED -> SYNCED (TO: 1776)"
      test_cases:
        - input: "2025-09-15 13:48:11 0 [Note] WSREP: Shifting DONOR/DESYNCED -> JOINED (TO: 1645)"
          expected:
            timestamp: "2025-09-15 13:48:11"
            level: "Note"
            from_state: "DONOR/DESYNCED"
            to_state: "JOINED"
            transaction_order: "1645"