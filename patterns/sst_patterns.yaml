# MariaDB 10.6+ State Transfer Patterns
# Enhanced patterns for extracting SST/IST information with lifecycle classification

version: "10.6"
description: "Enhanced state transfer patterns for MariaDB 10.6+ Galera cluster with lifecycle management"
mariadb_versions: ["10.6", "10.7", "10.8", "10.9", "10.10", "10.11"]

patterns:
  STATE_TRANSFER:
    # SST START EVENTS - ONLY the actual SST request should create sessions
    - name: "sst_member_selection_with_names"
      description: "SST member selection with donor and joiner node names - THE ONLY START EVENT"
      confidence: 0.95
      lifecycle_phase: "START"
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+Member (?P<joiner_index>\d+)\.(?P<joiner_id>\d+) \((?P<joiner_name>[^)]+)\) requested state transfer from.*Selected (?P<donor_index>\d+)\.(?P<donor_id>\d+) \((?P<donor_name>[^)]+)\)'
      field_mappings:
        joiner_name: "joiner_node"
        donor_name: "donor_node"
        transfer_status: "requested"
        transfer_type: "SST"
      required_fields: ["joiner_node", "donor_node"]
      examples:
        - "2025-09-19 18:17:17 0 [Note] WSREP: Member 0.4 (vinfr-db-d-l05) requested state transfer from *any*. Selected 1.1 (vinfr-db-d-d01)(SYNCED) as donor."

    # SST PROGRESS EVENTS - All these should update existing sessions, never create new ones
    - name: "sst_running_command"
      description: "SST command execution start (matches hardcoded pattern)"
      confidence: 0.95
      lifecycle_phase: "PROGRESS"
      regex: "(?P<timestamp>\\d{4}-\\d{2}-\\d{2}\\s+\\d{2}:\\d{2}:\\d{2})\\s+\\d+\\s+\\[(?P<level>\\w+)\\]\\s+WSREP:\\s+Running:\\s+'wsrep_sst_(?P<transfer_method>\\w+).*?--role\\s+'(?P<role>\\w+)'"
      entity_type: "STATE_TRANSFER"
      field_mappings:
        transfer_status: "started"
        transfer_type: "SST"
      required_fields: ["transfer_method", "role"]
      examples:
        - "2025-09-15 13:45:56 0 [Note] WSREP: Running: 'wsrep_sst_mariabackup --role 'donor' --address '10.0.1.192:4444/xtrabackup_sst//1'"

    - name: "wsrep_sst_script_started"
      description: "WSREP_SST script started message (PROGRESS event)"
      confidence: 0.9
      lifecycle_phase: "PROGRESS"
      regex: '^WSREP_SST:\s+\[INFO\]\s+(?P<transfer_method>\w+)\s+(?P<transfer_type>SST)\s+started\s+on\s+(?P<role>joiner|donor)\s+\((?P<timestamp_script>\d{8}\s+\d{2}:\d{2}:\d{2}\.\d+)\)'
      field_mappings:
        transfer_status: "script_started"
      required_fields: ["transfer_method", "transfer_type", "role"]
      examples:
        - "WSREP_SST: [INFO] mariabackup SST started on joiner (20250919 11:10:38.867)"

    - name: "sst_donor_selection"
      description: "SST donor node selection (PROGRESS event)"
      confidence: 0.9
      lifecycle_phase: "PROGRESS"
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+(?:Donor|Selected)\s+(?P<donor_node>[a-f0-9-]+)\s+at\s+(?P<donor_address>[\d\.]+:\d+)'
      field_mappings:
        transfer_status: "donor_selected"
      required_fields: ["donor_node", "donor_address"]
      examples:
        - "2024-09-15 10:30:47 12346 [Note] WSREP: Donor a1b2c3d4-e5f6-7890-abcd-123456789012 at 192.168.1.100:4567"

    - name: "sst_method_start"
      description: "SST method and command details (PROGRESS event)"
      confidence: 0.8
      lifecycle_phase: "PROGRESS"
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+(?P<transfer_type>SST|IST)\s+method:\s+(?P<transfer_method>\w+)(?:\s+cmd:\s+(?P<sst_command>.+))?'
      field_mappings:
        transfer_status: "method_selected"
      required_fields: ["transfer_type", "transfer_method"]
      examples:
        - "2024-09-15 10:30:48 12347 [Note] WSREP: SST method: mariabackup cmd: mariabackup --defaults-file=/etc/mysql/my.cnf"

    - name: "sst_progress_update"
      description: "SST transfer progress updates (PROGRESS event)"
      confidence: 0.85
      lifecycle_phase: "PROGRESS"
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+(?:WSREP|mariabackup):\s+(?:Progress|Sending|Transferred).*?(?P<progress_percentage>\d+(?:\.\d+)?)%|(?P<transferred_bytes>\d+)\s*(?:MB|GB|bytes)|rate.*?(?P<transfer_rate>\d+(?:\.\d+)?)'
      field_mappings:
        transfer_status: "in_progress"
      required_fields: []
      examples:
        - "2024-09-15 10:32:00 12348 [Note] WSREP: Progress 45.5% transferred"
        - "2024-09-15 10:32:15 12349 [Note] mariabackup: Sending 1024 MB at rate 50.5 MB/s"

    - name: "sst_seqno_range"
      description: "SST sequence number range information (PROGRESS event)"
      confidence: 0.9
      lifecycle_phase: "PROGRESS"
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+(?P<transfer_type>SST|IST)\s+(?:from|to)\s+seqno\s+(?P<seqno_start>\d+)(?:\s+to\s+(?P<seqno_end>\d+))?'
      field_mappings:
        transfer_status: "seqno_update"
      required_fields: ["transfer_type"]
      examples:
        - "2024-09-15 10:32:15 12348 [Note] WSREP: SST from seqno 10000 to 12345"
        - "2024-09-15 10:32:16 12349 [Note] WSREP: IST to seqno 12500"

    # SST END EVENTS
    - name: "sst_completion"
      description: "SST transfer completion (END event)"
      confidence: 0.95
      lifecycle_phase: "END"
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+(?P<transfer_type>SST|IST)\s+(?P<transfer_status>completed|finished|done)(?:\s+with\s+seqno\s+(?P<seqno_end>\d+))?(?:\s+transferred\s+(?P<transferred_bytes>\d+)\s+bytes)?'
      field_mappings:
        transfer_status: "completed"
      required_fields: ["transfer_type", "transfer_status"]
      examples:
        - "2024-09-15 10:35:20 12350 [Note] WSREP: SST completed with seqno 12345"
        - "2024-09-15 10:35:21 12351 [Note] WSREP: SST finished transferred 1048576 bytes"

    - name: "sst_error"
      description: "SST error and failure messages (ERROR event)"
      confidence: 0.95
      lifecycle_phase: "ERROR"
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>ERROR|Warning)\]\s+WSREP:\s+(?P<transfer_type>SST|IST)\s+(?:failed|error|abort|timeout)(?:\s+(?P<error_code>\d+))?(?:\s*:\s*(?P<error_message>.+))?'
      field_mappings:
        transfer_status: "failed"
      required_fields: ["transfer_type"]
      examples:
        - "2024-09-15 10:33:30 12349 [ERROR] WSREP: SST failed 2: mariabackup process failed"
        - "2024-09-15 10:33:31 12350 [ERROR] WSREP: SST timeout"

    # IST SPECIFIC EVENTS
    - name: "ist_status"
      description: "IST (Incremental State Transfer) status messages"
      confidence: 0.9
      lifecycle_phase: "AUTO"  # Auto-detect based on status
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+(?P<transfer_type>IST)\s+(?P<transfer_status>started|completed|cancelled|failed)(?:\s+gap:\s+(?P<seqno_start>\d+)-(?P<seqno_end>\d+))?'
      required_fields: ["transfer_type", "transfer_status"]
      examples:
        - "2024-09-15 10:31:00 12347 [Note] WSREP: IST started gap: 12000-12345"
        - "2024-09-15 10:31:45 12351 [Note] WSREP: IST completed"

    # BACKUP-SPECIFIC PATTERNS  
    - name: "mariabackup_progress"
      description: "Mariabackup-specific progress messages"
      confidence: 0.8
      lifecycle_phase: "PROGRESS"
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+mariabackup:\s+(?:Progress|Streaming|backup).*?(?P<progress_percentage>\d+(?:\.\d+)?)%|(?P<transferred_bytes>\d+(?:\.\d+)?)\s*(?P<size_unit>MB|GB|KB)|(?P<transfer_rate>\d+(?:\.\d+)?)\s*(?P<rate_unit>MB/s|KB/s)'
      field_mappings:
        transfer_method: "mariabackup"
        transfer_status: "in_progress"
      required_fields: []
      examples:
        - "2024-09-15 10:32:30 12349 [Note] mariabackup: Progress 67.8% completed"
        - "2024-09-15 10:32:35 12350 [Note] mariabackup: Streaming 256.5 MB at 45.2 MB/s"

    # NODE NAME EXTRACTION PATTERNS - Additional patterns for updating sessions

    - name: "sst_transfer_failure_with_names"
      description: "SST transfer failure with donor and joiner node names"
      confidence: 0.9
      lifecycle_phase: "ERROR"
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[(?P<level>\w+)\]\s+WSREP:\s+(?P<donor_index>\d+)\.(?P<donor_id>\d+) \((?P<donor_name>[^)]+)\): State transfer to (?P<joiner_index>\d+)\.(?P<joiner_id>\d+) \((?P<joiner_name>[^)]+)\) failed'
      field_mappings:
        donor_name: "donor_node"
        joiner_name: "joiner_node"
        transfer_status: "failed"
        transfer_type: "SST"
      required_fields: ["donor_node", "joiner_node"]
      examples:
        - "2025-09-19 18:33:48 0 [Warning] WSREP: 1.1 (vinfr-db-d-d01): State transfer to 0.4 (vinfr-db-d-l05) failed: Invalid argument"

    # SST SUCCESS COMPLETION PATTERNS
    - name: "sst_transfer_complete_donor"
      description: "SST transfer completion from donor's perspective"
      confidence: 0.95
      lifecycle_phase: "END"
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[\w+\]\s+WSREP:\s+\d+\.\d+ \((?P<donor_node>[^)]+)\): State transfer to \d+\.\d+ \((?P<joiner_node>[^)]+)\) (?P<transfer_status>complete)\.'
      field_mappings:
        transfer_status: "completed"  # Normalize "complete" to "completed"
      required_fields: ["donor_node", "joiner_node"]
      examples:
        - "2025-09-19 11:10:54 0 [Note] WSREP: 0.0 (NODE_54320): State transfer to 1.0 (NODE_50000) complete."

    - name: "sst_transfer_complete_joiner"
      description: "SST transfer completion from joiner's perspective"
      confidence: 0.95
      lifecycle_phase: "END"
      regex: '(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\d+\s+\[\w+\]\s+WSREP:\s+\d+\.\d+ \((?P<joiner_node>[^)]+)\): State transfer from \d+\.\d+ \((?P<donor_node>[^)]+)\) (?P<transfer_status>complete)\.'
      field_mappings:
        transfer_status: "completed"  # Normalize "complete" to "completed"
      required_fields: ["joiner_node", "donor_node"]
      examples:
        - "2025-09-19 11:12:24 0 [Note] WSREP: 1.0 (NODE_50000): State transfer from 0.0 (NODE_54320) complete."



    - name: "wsrep_sst_script_completed"
      description: "WSREP_SST script completed message"
      confidence: 0.95
      lifecycle_phase: "END"
      regex: '^WSREP_SST:\s+\[INFO\]\s+(?P<transfer_method>\w+)\s+(?P<transfer_type>SST)\s+completed\s+on\s+(?P<role>joiner|donor)\s+\((?P<timestamp_script>\d{8}\s+\d{2}:\d{2}:\d{2}\.\d+)\)'
      field_mappings:
        transfer_status: "script_completed"
      required_fields: ["transfer_method", "transfer_type", "role"]
      examples:
        - "WSREP_SST: [INFO] mariabackup SST completed on joiner (20250919 11:10:54.872)"