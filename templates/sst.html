<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SST Sessions Report - Galera Cluster Timeline</title>
    <link href="https://fonts.googleapis.com/css?family=Inter:400,500,700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f3f6fc;
            color: #1f2933;
            line-height: 1.6;
        }
        .main-header {
            padding: 1.6em 4vw 0.8em;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: #fff;
            box-shadow: 0 8px 24px rgba(30,58,138,0.25);
            position: sticky;
            top: 0;
            z-index: 20;
        }
        #main-title {
            margin: 0;
            font-size: clamp(26px, 3vw, 36px);
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .nav-actions {
            margin-top: 0.8em;
            display: flex;
            gap: 0.8em;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 0.35em;
            padding: 0.45em 0.9em;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s ease;
        }
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .main-content {
            padding: 2em 4vw 6em;
            max-width: 1200px;
            margin: 0 auto;
        }
        .report-container {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(148, 163, 184, 0.28);
            overflow: hidden;
        }
        .report-header {
            padding: 1.5em 2em;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1em;
        }
        .report-header h2 {
            margin: 0;
            color: #1e40af;
            font-size: 1.4rem;
            font-weight: 600;
        }
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4em;
            padding: 0.5em 1em;
            background: #1e40af;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s ease;
        }
        .download-btn:hover {
            background: #1d4ed8;
        }
        .report-content {
            padding: 0;
        }
        .report-text {
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            white-space: pre-wrap;
            margin: 0;
            padding: 2em;
            background: #fafbfc;
            color: #374151;
            overflow-x: auto;
        }
        .empty-state {
            text-align: center;
            padding: 4em 2em;
            color: #6b7280;
        }
        .empty-state h3 {
            margin: 0 0 0.5em 0;
            color: #9ca3af;
            font-size: 1.2rem;
            font-weight: 500;
        }
        .empty-state p {
            margin: 0;
            font-size: 0.9rem;
        }
        @media (max-width: 640px) {
            .main-content {
                padding: 1.5em 3vw 4em;
            }
            .report-header {
                padding: 1.2em 1.5em;
                flex-direction: column;
                align-items: stretch;
            }
            .report-text {
                padding: 1.5em;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <header class="main-header">
        <h1 id="main-title">SST Sessions Report</h1>
        <div class="nav-actions">
            <a class="nav-link" href="/">← Back to Timeline</a>
        </div>
    </header>
    
    <main class="main-content">
        <div class="report-container">
            {% if report_text %}
            <div class="report-header">
                <h2>SST/IST Hierarchical Analysis</h2>
                <a class="download-btn" href="/sst?download=1">
                    📄 Download Report
                </a>
            </div>
            <div class="report-content">
                <pre class="report-text">{{ report_text }}</pre>
            </div>
            {% else %}
            <div class="empty-state">
                <h3>No SST Report Available</h3>
                <p>The SST report is generated when running with <code>graa --sst</code> output.<br>
                Use <code>grax</code> to regenerate the complete analysis pipeline.</p>
            </div>
            {% endif %}
        </div>
    </main>
</body>
</html>
