<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>grav: Galera Cluster Timeline</title>
    <link href="https://fonts.googleapis.com/css?family=Inter:400,500,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/grambo.css">
    <style>
        :root {
            color-scheme: light;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f3f6fc;
            color: #1f2933;
        }
        .main-header {
            padding: 1.6em 4vw 0.8em;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: #fff;
            box-shadow: 0 8px 24px rgba(30,58,138,0.25);
            position: sticky;
            top: 0;
            z-index: 20;
        }
        #main-title {
            margin: 0;
            font-size: clamp(26px, 3vw, 36px);
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .board-wrapper {
            padding: 2em 4vw 6em;
        }
        .frame-meta {
            display: flex;
            justify-content: flex-end;
            padding: 0.6em 4vw 0;
        }
        #frame-info {
            color: #1d4ed8;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5em;
            align-items: stretch;
        }
        .card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(148, 163, 184, 0.28);
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.2s ease;
            cursor: grab;
        }
        .card:active {
            cursor: grabbing;
        }
        .card.dragging {
            opacity: 0.6;
            box-shadow: 0 20px 32px rgba(15, 23, 42, 0.18);
        }
        .card-header {
            padding: 1.1em 1.3em 0.6em;
            font-weight: 600;
            font-size: 1.05rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            color: #1d4ed8;
        }
        .card-header span.hint {
            font-size: 0.75rem;
            color: rgba(29, 78, 216, 0.7);
            letter-spacing: 0.4px;
        }
        .card-body {
            padding: 1.1em 1.3em 1.3em;
            overflow: auto;
        }
        .card-body::-webkit-scrollbar {
            width: 6px;
        }
        .card-body::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.5);
            border-radius: 999px;
        }
        .entity-block {
            padding: 0.45em 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.18);
        }
        .entity-block:last-child {
            border-bottom: none;
        }
        .gcomm-local {
            margin-top: 0.65em;
            border: 1px solid rgba(37, 99, 235, 0.22);
            border-radius: 10px;
            background: rgba(37, 99, 235, 0.06);
            overflow: hidden;
        }
        .gcomm-local summary {
            list-style: none;
            cursor: pointer;
            padding: 0.55em 0.9em;
            background: rgba(37, 99, 235, 0.08);
            color: #1d4ed8;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .gcomm-local summary::marker,
        .gcomm-local summary::-webkit-details-marker {
            display: none;
        }
        .gcomm-local summary span.toggle-icon {
            font-size: 0.75rem;
            opacity: 0.7;
        }
        .gcomm-local[open] summary span.toggle-icon {
            transform: rotate(90deg);
        }
        .gcomm-local-content {
            padding: 0.55em 0.9em 0.7em;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .gcomm-local-content .entity-label {
            min-width: 120px;
            font-size: 0.8rem;
        }
        .gcomm-local-content .entity-value {
            font-size: 0.8rem;
        }
        .empty-state.small {
            font-size: 0.8rem;
            padding: 0.4em 0;
        }
        .entity-block-group {
            margin-bottom: 1em;
        }
        .entity-block-group:last-child {
            margin-bottom: 0;
        }
        .entity-subtitle {
            font-weight: 600;
            color: #0f172a;
            letter-spacing: 0.35px;
            text-transform: uppercase;
            font-size: 0.75rem;
            margin-bottom: 0.35em;
        }
        .entity-label {
            display: inline-block;
            min-width: 140px;
            font-weight: 400;
            font-size: 0.9rem;
            color: #4b5563;
            text-transform: lowercase;
            letter-spacing: 0.1px;
        }
        .entity-value {
            color: #1f2937;
            font-weight: 400;
            font-size: 0.9rem;
        }
        .accent-cluster {
            color: #1d4ed8;
        }
        .accent-quorum {
            color: #7c3aed;
        }
        .accent-node {
            color: #16a34a;
        }
        .accent-view {
            color: #f97316;
        }
        .empty-state {
            padding: 0.6em 0;
            color: #94a3b8;
            font-style: italic;
        }
        .nav-link {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 0.35em;
            padding: 0.45em 0.9em;
            border-radius: 999px;
            background: rgba(29, 78, 216, 0.12);
            color: #1d4ed8;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .nav-link:hover {
            background: rgba(29, 78, 216, 0.22);
            color: #1e40af;
        }
        #nav {
            backdrop-filter: blur(12px);
        }
        #graph {
            width: 100%;
            min-height: 320px;
        }
        #nodes-section .entity-block {
            min-height: 0;
        }
        @media (max-width: 640px) {
            .board-wrapper {
                padding: 1.3em 5vw 6em;
            }
            .card-header {
                font-size: 1rem;
            }
            .entity-label {
                min-width: 120px;
            }
            .nav-link {
                margin-left: 0;
                margin-top: 0.6em;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="main-header">
        <h1 id="main-title">Grambo Cluster Timeline</h1>
    </header>
    <div class="frame-meta">
        <div id="frame-info"></div>
    </div>
    <!-- Main content ...existing code... -->
    <div id="nav" style="position: fixed; bottom: 0; left: 0; width: 100vw; background: #f8f9fa; border-top: 1px solid #ddd; display: flex; align-items: center; gap: 1em; padding: 0.7em 2vw 0.7em 2vw; z-index: 10; box-shadow: 0 -2px 8px rgba(0,0,0,0.03); flex-wrap: wrap;">
        <span id="frame-timestamp" style="min-width: 140px; color: #1976d2; font-size: 14px;"></span>
        <button id="prev-btn">Prev</button>
        <input type="number" id="frame-num" min="1" value="1" style="width:4em;">
        / <span id="total-frames">0</span>
        <button id="next-btn">Next</button>
        <input type="range" id="timeline-bar" min="1" value="1" style="flex:1; margin-left:1em; margin-right:1em;">
        {% if sst_available %}
        <a class="nav-link" href="/sst" target="_blank" rel="noopener">View SST Sessions</a>
        {% endif %}
    </div>
    <main class="board-wrapper">
        <div id="card-board" class="card-grid">
            <div class="card" data-card="graph" draggable="true">
                <div class="card-header">Cluster Graph <span class="hint">drag to reposition</span></div>
                <div class="card-body">
                    <div id="graph"></div>
                </div>
            </div>
            <div class="card" data-card="cluster" draggable="true">
                <div class="card-header">Cluster Details <span class="hint">drag to reposition</span></div>
                <div class="card-body" id="cluster-section"></div>
            </div>
            <div class="card" data-card="views" draggable="true">
                <div class="card-header">View Layers <span class="hint">drag to reposition</span></div>
                <div class="card-body" id="views-section"></div>
            </div>
            <div class="card" data-card="quorum" draggable="true">
                <div class="card-header">Quorum State <span class="hint">drag to reposition</span></div>
                <div class="card-body" id="quorum-section"></div>
            </div>
            <div class="card" data-card="nodes" draggable="true">
                <div class="card-header">Nodes <span class="hint">drag to reposition</span></div>
                <div class="card-body" id="nodes-section"></div>
            </div>
        </div>
    </main>
    <script>
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatEntityValue(value) {
            if (value === null || value === undefined) {
                return '';
            }
            if (Array.isArray(value)) {
                if (value.length === 0) return '[]';
                return value.map(item => {
                    if (item === null || item === undefined) return '';
                    if (typeof item === 'object') return '[object]';
                    return String(item);
                }).join(', ');
            }
            if (typeof value === 'object') {
                const keys = Object.keys(value || {});
                if (keys.length === 0) return '[object]';
                return `{${keys.join(', ')}}`;
            }
            return String(value);
        }

        function renderPropertyList(props, allowed, accentClass) {
            let html = '';
            const labelClass = accentClass ? `entity-label ${accentClass}` : 'entity-label';
            allowed.forEach(key => {
                if (!Object.prototype.hasOwnProperty.call(props, key)) return;
                const raw = props[key];
                if (raw === undefined || raw === null || raw === '') return;
                const formatted = escapeHtml(formatEntityValue(raw));
                const safeKey = escapeHtml(key);
                html += `<div class="entity-block"><span class="${labelClass}">${safeKey}:</span> <span class="entity-value">${formatted}</span></div>`;
            });
            return html;
        }

        let latestGraphNodes = [];

        function updateFrame(idx) {
            // Always clear timestamp field at start
            document.getElementById('frame-timestamp').textContent = '';
            fetch(`/frame/${idx}`)
                .then(r => r.json())
                .then(data => {
                    if (data.error) return;
                    currentFrame = data.idx;
                    document.getElementById('frame-num').value = currentFrame + 1;
                    document.getElementById('total-frames').textContent = data.total;
                    document.getElementById('timeline-bar').max = data.total;
                    document.getElementById('timeline-bar').value = currentFrame + 1;
                    
                    let entities = data.entities || {};
                    // Show frame timestamp at left of timeline bar
                    let ts = '';
                    if (data.timestamp) {
                        ts = data.timestamp;
                    } else if (entities && Object.values(entities).length > 0) {
                        // fallback: try to find a timestamp field in any entity (prefer cluster, quorum, node, view)
                        let preferred = ['cluster:', 'quorum:', 'view:', 'node:'];
                        let found = null;
                        for (let pref of preferred) {
                            for (let ent in entities) {
                                if (ent.startsWith(pref) && entities[ent].timestamp) {
                                    found = entities[ent].timestamp;
                                    break;
                                }
                            }
                            if (found) break;
                        }
                        if (!found) {
                            // fallback: any entity with timestamp
                            for (let ent in entities) {
                                if (entities[ent].timestamp) {
                                    found = entities[ent].timestamp;
                                    break;
                                }
                            }
                        }
                        ts = found || '';
                    }
                    const tsDisplay = ts ? ts.replace('T', ' ').replace('Z', '') : '—';
                    document.getElementById('frame-timestamp').textContent = tsDisplay;
                    document.getElementById('frame-info').textContent = tsDisplay;
                    // Cluster card
                    const clusterDiv = document.getElementById('cluster-section');
                    clusterDiv.innerHTML = '';
                    const clusterEntities = Object.entries(entities).filter(([key]) => key.startsWith('cluster:'));
                    const clusterFields = [
                        'analysis_start_time', 'cluster_name', 'cluster_ref', 'cluster_uuid',
                        'members', 'split_brain_detected', 'sst_operations', 'views'
                    ];
                    if (clusterEntities.length === 0) {
                        clusterDiv.innerHTML = `<div class="empty-state">No cluster data for this frame</div>`;
                    } else {
                        clusterEntities.forEach(([entKey, props]) => {
                            let block = '<div class="entity-block-group">';
                            if (clusterEntities.length > 1) {
                                block += `<div class="entity-subtitle">${escapeHtml(entKey.replace('cluster:', ''))}</div>`;
                            }
                            const metrics = renderPropertyList(props, clusterFields, 'accent-cluster');
                            block += metrics || `<div class="empty-state">No cluster metrics</div>`;
                            block += '</div>';
                            clusterDiv.innerHTML += block;
                        });
                    }

                    // View layers card
                    const viewsDiv = document.getElementById('views-section');
                    viewsDiv.innerHTML = '';
                    const viewEntities = Object.entries(entities).filter(([key]) => key.startsWith('view:'));
                    const viewFields = ['status', 'cluster_state', 'view_id', 'view_seq', 'member_count', 'own_index', 'member_summary', 'members', 'capabilities', 'timestamp'];
                    if (viewEntities.length === 0) {
                        viewsDiv.innerHTML = '<div class="empty-state">No view data for this frame</div>';
                    } else {
                        const groupedViews = {};
                        viewEntities.forEach(([entKey, props]) => {
                            const parts = entKey.split(':');
                            const clusterKey = parts[1] || (props.cluster_ref || 'cluster');
                            const layerName = (parts[2] || props.view_layer || 'gcomm').toUpperCase();
                            if (!groupedViews[clusterKey]) {
                                groupedViews[clusterKey] = [];
                            }
                            groupedViews[clusterKey].push({ layer: layerName, props });
                        });
                        Object.entries(groupedViews).forEach(([clusterKey, layers]) => {
                            let block = '<div class="entity-block-group">';
                            block += `<div class="entity-subtitle">${escapeHtml(clusterKey)}</div>`;
                            layers.sort((a, b) => a.layer.localeCompare(b.layer));
                            layers.forEach(({ layer, props }) => {
                                block += `<div class="entity-block"><span class="entity-label accent-view">layer:</span> <span class="entity-value">${escapeHtml(layer)}</span></div>`;
                                block += renderPropertyList(props, viewFields, 'accent-view') || `<div class="empty-state">No data for ${escapeHtml(layer)}</div>`;
                            });
                            block += '</div>';
                            viewsDiv.innerHTML += block;
                        });
                    }

                    // Quorum card
                    const quorumDiv = document.getElementById('quorum-section');
                    quorumDiv.innerHTML = '';
                    const quorumEntities = Object.entries(entities).filter(([key]) => key.startsWith('quorum:'));
                    const quorumFields = ['component', 'conf_id', 'group_uuid', 'last_appl', 'protocols', 'quorum_members', 'version', 'vote_policy'];
                    if (quorumEntities.length === 0) {
                        quorumDiv.innerHTML = `<div class="empty-state">No quorum data for this frame</div>`;
                    } else {
                        quorumEntities.forEach(([entKey, props]) => {
                            let block = '<div class="entity-block-group">';
                            if (quorumEntities.length > 1) {
                                block += `<div class="entity-subtitle">${escapeHtml(entKey.replace('quorum:', ''))}</div>`;
                            }
                            const metrics = renderPropertyList(props, quorumFields, 'accent-quorum');
                            block += metrics || `<div class="empty-state">No quorum metrics</div>`;
                            block += '</div>';
                            quorumDiv.innerHTML += block;
                        });
                    }

                    // Nodes card
                    const nodesDiv = document.getElementById('nodes-section');
                    nodesDiv.innerHTML = '';
                    const nodeEntities = Object.entries(entities).filter(([key]) => key.startsWith('node:'));
                    const nodeFields = [
                        'node_name', 'node_state', 'node_uuid', 'mariadb_version',
                        'galera_version', 'wsrep_version', 'node_address', 'node_id', 'timestamp'
                    ];
                    const gcommFields = [
                        'view_id',
                        'component_state',
                        'component_uuid',
                        'view_layer',
                        'members_with_segments',
                        'joined_with_segments',
                        'left_with_segments',
                        'partitioned_with_segments',
                        'member_segments',
                        'timestamp'
                    ];
                    if (nodeEntities.length === 0) {
                        nodesDiv.innerHTML = '<div class="empty-state">No node data for this frame</div>';
                    } else {
                        nodeEntities.forEach(([entKey, props]) => {
                            let block = '<div class="entity-block-group">';
                            const title = props.node_name || entKey.replace('node:', '');
                            block += `<div class="entity-subtitle">${escapeHtml(title)}</div>`;
                            const metrics = renderPropertyList(props, nodeFields, 'accent-node');
                            block += metrics || `<div class="empty-state">No node metrics</div>`;
                            const gcomm = props.gcomm_view;
                            if (gcomm && Object.keys(gcomm).length > 0) {
                                const gcommMetrics = renderPropertyList(gcomm, gcommFields, 'accent-view');
                                const gcommContent = gcommMetrics || `<div class="empty-state small">No local gcomm data</div>`;
                                block += `<details class="gcomm-local">
                                    <summary>Local GComm View <span class="toggle-icon">▶</span></summary>
                                    <div class="gcomm-local-content">${gcommContent}</div>
                                </details>`;
                            }
                            block += '</div>';
                            nodesDiv.innerHTML += block;
                        });
                    }

                    // Graph section (center)
                    latestGraphNodes = nodeEntities;
                    drawNodeGraph(latestGraphNodes);
                });
        }
    let totalFrames = Number('{{ total_frames }}') || 0;
        let currentFrame = 0;

        

        // Draw SVG node graph
        function drawNodeGraph(nodeEntities) {
            const graphDiv = document.getElementById('graph');
            if (!graphDiv) return;
            graphDiv.innerHTML = '';
            if (nodeEntities.length === 0) {
                graphDiv.innerHTML = '<div class="empty-state">No nodes available for graph</div>';
                return;
            }
            const n = nodeEntities.length;
            const width = Math.max(280, graphDiv.clientWidth || 320);
            const height = Math.max(280, Math.min(width + 40, 420));
            const centerX = width / 2;
            const centerY = height / 2;
            const circleRadius = 28;
            const graphRadius = Math.max(70, Math.min(centerX, centerY) - circleRadius - 10);
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            svg.setAttribute('width', width);
            svg.setAttribute('height', height);
            svg.style.width = '100%';
            svg.style.height = `${height}px`;
            // Draw connecting lines
            for (let i = 0; i < n; i++) {
                const angle1 = (2 * Math.PI * i) / n - Math.PI / 2;
                const x1 = centerX + graphRadius * Math.cos(angle1);
                const y1 = centerY + graphRadius * Math.sin(angle1);
                const angle2 = (2 * Math.PI * ((i + 1) % n)) / n - Math.PI / 2;
                const x2 = centerX + graphRadius * Math.cos(angle2);
                const y2 = centerY + graphRadius * Math.sin(angle2);
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('stroke', '#b0bec5');
                line.setAttribute('stroke-width', 2);
                svg.appendChild(line);
            }
            // Draw nodes
            nodeEntities.forEach(([ent, props], i) => {
                const angle = (2 * Math.PI * i) / n - Math.PI / 2;
                const x = centerX + graphRadius * Math.cos(angle);
                const y = centerY + graphRadius * Math.sin(angle);
                const color = nodeStateColor(props.node_state);
                // Circle
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', x);
                circle.setAttribute('cy', y);
                circle.setAttribute('r', circleRadius);
                circle.setAttribute('fill', color);
                circle.setAttribute('stroke', '#333');
                circle.setAttribute('stroke-width', 2);
                // Tooltip
                circle.addEventListener('mouseenter', function(e) {
                    const tooltip = document.createElement('div');
                    tooltip.id = 'node-tooltip';
                    tooltip.style.position = 'fixed';
                    tooltip.style.left = (e.clientX + 10) + 'px';
                    tooltip.style.top = (e.clientY - 10) + 'px';
                    tooltip.style.background = '#222';
                    tooltip.style.color = '#fff';
                    tooltip.style.padding = '4px 10px';
                    tooltip.style.borderRadius = '6px';
                    tooltip.style.fontSize = '12px';
                    tooltip.style.pointerEvents = 'none';
                    tooltip.style.zIndex = 1000;
                    tooltip.textContent = props.node_name || ent.replace('node:', '');
                    document.body.appendChild(tooltip);
                });
                circle.addEventListener('mouseleave', function() {
                    const tooltip = document.getElementById('node-tooltip');
                    if (tooltip) tooltip.remove();
                });
                svg.appendChild(circle);
                // Node name
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', x);
                text.setAttribute('y', y + circleRadius + 14);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('font-size', '12px');
                text.setAttribute('fill', '#333');
                text.textContent = props.node_name || ent.replace('node:', '');
                svg.appendChild(text);
            });
            graphDiv.appendChild(svg);
        }

        function initCardDragging() {
            const board = document.getElementById('card-board');
            if (!board) return;

            const savedOrder = window.localStorage ? window.localStorage.getItem('grav-card-order') : null;
            if (savedOrder) {
                try {
                    const order = JSON.parse(savedOrder);
                    order.forEach(key => {
                        const card = board.querySelector(`.card[data-card="${key}"]`);
                        if (card) {
                            board.appendChild(card);
                        }
                    });
                } catch (err) {
                    console.warn('Unable to restore card layout', err);
                }
            }

            let activeCard = null;

            board.addEventListener('dragstart', (event) => {
                const card = event.target.closest('.card');
                if (!card) return;
                activeCard = card;
                card.classList.add('dragging');
                event.dataTransfer.effectAllowed = 'move';
                event.dataTransfer.setData('text/plain', card.dataset.card || '');
            });

            board.addEventListener('dragend', () => {
                if (activeCard) {
                    activeCard.classList.remove('dragging');
                    activeCard = null;
                    persistOrder();
                }
            });

            board.addEventListener('dragover', (event) => {
                event.preventDefault();
                const afterElement = getDragAfterElement(board, event.clientY);
                const dragging = board.querySelector('.card.dragging');
                if (!dragging) return;
                if (afterElement == null) {
                    board.appendChild(dragging);
                } else if (afterElement !== dragging) {
                    board.insertBefore(dragging, afterElement);
                }
            });

            function persistOrder() {
                if (!window.localStorage) return;
                const order = [...board.querySelectorAll('.card')].map(card => card.dataset.card);
                window.localStorage.setItem('grav-card-order', JSON.stringify(order));
            }
        }

        function getDragAfterElement(container, mouseY) {
            const cards = [...container.querySelectorAll('.card:not(.dragging)')];
            let closest = { offset: Number.NEGATIVE_INFINITY, element: null };
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const offset = mouseY - rect.top - rect.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    closest = { offset, element: card };
                }
            });
            return closest.element;
        }

        // Map node_state to color
        function nodeStateColor(state) {
              if (!state) return '#e0e0e0'; // OPEN = light grey
              state = state.toUpperCase();
              if (state === 'OPEN') return '#e0e0e0'; // light grey
              if (state === 'PRIMARY') return '#fff'; // white
              if (state === 'JOINER') return '#ffe066'; // yellow
              if (state === 'JOINED') return '#b2f2bb'; // light green
              if (state === 'DONOR' || state === 'DESYNCED') return '#4dabf7'; // blue
              if (state === 'SYNCED') return '#51cf66'; // green
              if (state === 'CLOSED') return '#fa5252'; // red
              return '#e0e0e0';
        }

        document.getElementById('prev-btn').onclick = () => {
            if (currentFrame > 0) updateFrame(currentFrame - 1);
        };
        document.getElementById('next-btn').onclick = () => {
            if (currentFrame < totalFrames - 1) updateFrame(currentFrame + 1);
        };
        document.getElementById('frame-num').onchange = (e) => {
            let val = parseInt(e.target.value) - 1;
            if (val >= 0 && val < totalFrames) updateFrame(val);
        };
        document.getElementById('timeline-bar').oninput = (e) => {
            let val = parseInt(e.target.value) - 1;
            if (val >= 0 && val < totalFrames) updateFrame(val);
        };
        // (upload-form removed)
        initCardDragging();
        window.addEventListener('resize', () => {
            if (!latestGraphNodes) return;
            drawNodeGraph(latestGraphNodes);
        });
        // Initial state
        updateFrame(0);
    </script>
</body>
</html>
